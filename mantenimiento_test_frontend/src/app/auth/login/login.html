<section class="vh-100 d-flex align-items-center" style="background-color: #034079;">
  <div class="container py-5">
    <div class="row d-flex justify-content-center align-items-center">
      <div class="col-12 col-xl-11">
        <div class="card shadow" style="border-radius: 1rem; overflow: hidden;">
          <div class="row g-0 align-items-center">
            
            <div class="col-md-6 d-none d-md-block">
              <img src="assets/images/fondo_login.jpg" 
                   alt="Login image" 
                   class="w-100" 
                   style="height: 100%; min-height: 550px; object-fit: fill; object-position: center; display: block;">
            </div>
            
            <div class="col-md-6 d-flex align-items-center" style="background-color: #ffffff;">
              <div class="card-body p-4 p-lg-5 text-black w-100">

                <form [formGroup]="formLogin" autocomplete="off">

                  <div class="text-center mb-4">
                    <img src="assets/images/logo.png" class="img-fluid logo-img" style="max-height: 100px;">
                  </div>

                  <div class="form-floating mb-3">
                    <input class="form-control" type="busines_mail" id="busines_mailInput" formControlName="busines_mail" placeholder="name@example.com">
                    <label for="busines_mailInput">Correo</label>
                  </div>

                  <div class="form-floating mb-4">
                    <input class="form-control" type="password" id="passwordInput" formControlName="password" placeholder="Password">
                    <label for="passwordInput">Contraseña</label>
                  </div>

                  <div class="d-grid gap-2">
                    <button class="btn btn-lg fw-bold" style="background-color: #ffb703; color: #034079;" (click)="iniciarSesion()">
                      Iniciar Sesión
                    </button>
                  </div>

                </form>

              </div>
            </div>

          </div>
        </div>
      </div>
    </div>
  </div>
</section>
