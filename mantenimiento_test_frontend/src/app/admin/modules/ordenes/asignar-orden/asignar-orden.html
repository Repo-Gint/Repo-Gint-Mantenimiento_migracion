<div class="modal-body dashboard">
    <div class="pagetitle">
        <h4 class="t-bold"> Asignar orden</h4>

        <nav>
            <ol class="breadcrumb">
                <li class="breadcrumb-item">Odenes</li>
                <li class="breadcrumb-item active">Asignar orden</li>
            </ol>
        </nav>
    </div>

    <div class="row">
        <div class="col-12">
            <div class="card">
                <div class="card-body">
                    <form [formGroup]="formOrden">
                        <div class="row align-items-center p-3">
                            <app-dropdown [options]="listaUsuarios"></app-dropdown>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal-footer">
    <button class="btn btn-sm btn-primary" (click)="asignarOrden()">
    {{ yaTeniaUsuariosAsignados ? 'Reasignar' : 'Asignar' }}
</button>

    <button class="btn btn-sm btn-danger" (click)="cerrarModal()">
        Cancelar
    </button>
</div>
