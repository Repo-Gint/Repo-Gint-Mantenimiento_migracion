<div class="modal-body dashboard">
    <div class="pagetitle">
        <h4 class="t-bold">
            {{pkArea == null ? 'Registrar' : 'Actualizar'}} area
        </h4>
        <nav>
            <ol class="breadcrumb">
                <li class="breadcrumb-item">Area</li>
                <li class="breadcrumb-item active"> {{pkArea == null ? 'Registrar' : 'Actualizar'}} area</li>
            </ol>
        </nav>
    </div>

    <div class="row">
        <div class="col-12">
            <div class="card">
                <div class="card-body">
                    <form [formGroup]="formArea" class="row g-3" autocomplete="off">
                        <div class="col-lg-6">
                            <label for="area" class="form-label" >Area:</label>
                            <input id="area" type="text"
                             class="form-control form-control-sm" placeholder="area"
                                formControlName="area">
                        </div>

                        <div class="col-lg-6">
                            <label for="acronym" class="form-label" >Acronym:</label>
                            <input id="acronym" type="text"
                             class="form-control form-control-sm" placeholder="acronym"
                                formControlName="acronym">
                        </div>

                        <div class="col-lg-12">
                            <label for="color" class="form-label" >Color:</label>
                            <input id="color" type="text"
                             class="form-control form-control-sm" placeholder="color"
                                formControlName="color">
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<div class="modal-footer">
    <button *ngIf="pkArea == null" class="btn btn-sm btn-primary" (click)="registrarArea()">
        Registrar
    </button> 
        <button *ngIf="pkArea != null" class="btn btn-sm btn-warning" (click)="actualizarArea()">
        Actualizar
    </button>
    <button class="btn btn-sm btn-danger" (click)="cerrarModal()">
        {{cambiosForm || pkArea != null ? 'Cancelar' : 'Cerrar'}}
    </button>
</div>
