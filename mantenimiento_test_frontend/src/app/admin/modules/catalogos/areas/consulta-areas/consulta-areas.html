<div class="pagetitle">
    <h1>Areas</h1>
    <nav>
        <ol class="breadcrumb">
            <li class="breadcrumb-item">Areas</li>
            <li class="breadcrumb-item active">Consulta Areas</li>
        </ol>
    </nav>
</div>

<section class="section dashboard">
    <!-- Barra Superior de Filtros y Acciones -->
    <div class="card border-0 shadow-sm mb-3">
        <div class="card-body py-3">
            <div class="row align-items-center g-3">
                <!-- Buscador Global -->
                <div class="col-lg-7 col-md-6">
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0 text-muted ps-3">
                            <i class="bi bi-search"></i>
                        </span>
                        <input type="text" id="inputBusquedaGlobal" class="form-control bg-light border-start-0 ps-0 shadow-none"
                            placeholder="Buscar por área, abreviatura o color... [CTRL K]" 
                            [(ngModel)]="textoBusqueda" (input)="aplicarFiltros()">
                    </div>
                </div>

                <!-- Botón Switch Todos/Activos/Inactivos y Exportar -->
                <div class="col-lg-5 col-md-6 d-flex justify-content-end align-items-center gap-3">
                    <div class="status-segment-switch d-inline-flex align-items-center bg-white border rounded-pill p-1 shadow-xs">
                        <i class="bi bi-toggle-on text-primary fs-5 ms-2 me-1"></i>
                        <button type="button" class="btn btn-sm rounded-pill px-3 py-1 text-secondary font-medium transition-all"
                            [class.active-pill]="filtroEstado === 'todos'"
                            (click)="setFiltroEstado('todos')">
                            Todos
                        </button>
                        <button type="button" class="btn btn-sm rounded-pill px-3 py-1 text-secondary font-medium transition-all"
                            [class.active-pill]="filtroEstado === 'activos'"
                            (click)="setFiltroEstado('activos')">
                            Activos
                        </button>
                        <button type="button" class="btn btn-sm rounded-pill px-3 py-1 text-secondary font-medium transition-all"
                            [class.active-pill]="filtroEstado === 'inactivos'"
                            (click)="setFiltroEstado('inactivos')">
                            Inactivos
                        </button>
                    </div>

                    <button class="btn btn-animated btn-exportar rounded-pill px-3 py-1 fw-semibold d-inline-flex align-items-center gap-2 shadow-sm">
                        <i class="bi bi-file-earmark-excel-fill fs-6"></i>
                        <span>Exportar</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Tabla Principal de Áreas -->
    <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle text-center mb-0">
                    <thead class="table-light text-uppercase fs-7 text-muted">
                        <tr>
                            <th class="text-start py-3 ps-4">Area</th>
                            <th class="py-3">Abreviatura</th>
                            <th class="py-3">Color</th>
                            <th class="py-3">Status</th>
                            <th class="py-3 text-end pe-4">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let area of datosPaginados" class="row-hover-effect">
                            <td class="text-start ps-4">
                                <div class="d-flex align-items-center">
                                    <div class="rounded-3 p-2 me-3 bg-light-primary text-primary border">
                                        <i class="bi bi-diagram-3 fs-5"></i>
                                    </div>
                                    <div>
                                        <span class="fw-bold text-dark d-block">{{ area.area }}</span>
                                    </div>
                                </div>
                            </td>
                            <td>
                                <span class="badge bg-light text-dark border px-2 py-1 fw-bold">{{ area.acronym }}</span>
                            </td>
                            <td>
                                <span class="badge rounded-circle border shadow-sm d-inline-block color-dot-animated"
                                      [style.background-color]="area.color"
                                      [title]="area.color"
                                      style="width: 20px; height: 20px; vertical-align: middle;">
                                </span>
                            </td>
                            <td>
                                <span class="badge px-3 py-2 rounded-pill fw-bold"
                                      [ngClass]="(area.active == 1 || area.active === true || area.estado?.toLowerCase() === 'activo') 
                                        ? 'bg-success-subtle text-success border border-success-subtle' 
                                        : 'bg-danger-subtle text-danger border border-danger-subtle'">
                                    &bull; {{ area.estado }}
                                </span>
                            </td>
                            <td class="text-end pe-4">
                                <div class="btn-group gap-1">
                                    <button class="btn btn-sm btn-outline-primary border-0 bg-light-primary btn-action" title="Editar"
                                        (click)="abrirModalRegistrarArea(area.id_area)">
                                        <i class="bi bi-pencil"></i>
                                    </button>
                                    <button *ngIf="!(area.active == 1 || area.active === true || area.estado?.toLowerCase() === 'activo')" 
                                            class="btn btn-sm btn-outline-success border-0 bg-light-success btn-action" title="Activar"
                                        (click)="cambiarStatus(area)">
                                        <i class="bi bi-check-lg"></i>
                                    </button>
                                    <button *ngIf="area.active == 1 || area.active === true || area.estado?.toLowerCase() === 'activo'" 
                                            class="btn btn-sm btn-outline-danger border-0 bg-light-danger btn-action" title="Desactivar"
                                        (click)="cambiarStatus(area)">
                                        <i class="bi bi-x-lg"></i>
                                    </button>
                                </div>
                            </td>
                        </tr>
                        <tr *ngIf="datosPaginados.length === 0">
                            <td colspan="5" class="text-center py-5 text-muted">
                                <i class="bi bi-inbox fs-2 d-block mb-2 text-secondary"></i>
                                No se encontraron áreas disponibles para la consulta actual.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Paginación Footer Dinámica -->
        <div class="card-footer bg-white py-3 d-flex justify-content-between align-items-center border-0 pe-4 ps-4">
            <span class="text-muted fs-7">Mostrando <strong>{{ datosPaginados.length }}</strong> de <strong>{{ datosFiltrados.length }}</strong> registros en total</span>
            <nav *ngIf="totalPaginas > 1">
                <ul class="pagination pagination-sm mb-0">
                    <li class="page-item" [class.disabled]="paginaActual === 1">
                        <button class="page-link shadow-none" (click)="cambiarPagina(paginaActual - 1)">Anterior</button>
                    </li>
                    <li class="page-item" *ngFor="let p of paginas" [class.active]="p === paginaActual">
                        <button class="page-link shadow-none" (click)="cambiarPagina(p)">{{ p }}</button>
                    </li>
                    <li class="page-item" [class.disabled]="paginaActual === totalPaginas">
                        <button class="page-link shadow-none" (click)="cambiarPagina(paginaActual + 1)">Siguiente</button>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</section>
