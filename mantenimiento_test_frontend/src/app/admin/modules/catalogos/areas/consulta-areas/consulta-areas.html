<div class="pagetitle">
    <h1>Areas</h1>
    <nav>
        <ol class="breadcrumb">
            <li class="breadcrumb-item">Areas</li>
            <li class="breadcrumb-item active">Consulta Areas</li>
        </ol>
    </nav>
</div>

<section class="section dashboard">
    <div class="row">
        <div class="col-12">

            <div class="card">
                <div class="card-body row g-3">
                    <div class="botonera">
                        <button class="btn btn-success btn-sm">
                            Exportar
                        </button>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-12">
            <table class="table table-striped table-hover text-center">
                <thead>
                    <tr>
                        <th>Area</th>
                        <th>Acronym</th>
                        <th>color</th>
                        <th>Status</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let area of datosTabla">
                        <td>{{area.area}}</td>
                        <td>{{area.acronym}}</td>
                        <td>{{area.color}}</td>
                        <td>{{area.estado}}</td>
                        <td class="text-medium">
                            <button class="btn btn-sm btn-outline-primary"
                                (click)="abrirModalRegistrarArea(area.id_area)">
                                <i class="bi bi-pencil"></i>
                            </button>
                            <button *ngIf="!area.activo" class="btn btn-sm btn-outline-info"
                                (click)="cambiarStatus(area)">
                                <i class="bi bi-check"></i>
                            </button>
                            <button *ngIf="area.activo" class="btn btn-sm btn-outline-warning"
                                (click)="cambiarStatus(area)">
                                <i class="bi bi-x"></i>
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
