<div class="modal-body dashboard">
    <div class="pagetitle">
        <h4 class="t-bold">
            {{pkDepartamento == null ? 'Registrar' : 'Actualizar'}} departamento
        </h4>
        <nav>
            <ol class="breadcrumb">
                <li class="breadcrumb-item">Departamento</li>
                <li class="breadcrumb-item active"> {{pkDepartamento == null ? 'Registrar' : 'Actualizar'}} departamento</li>
            </ol>
        </nav>
    </div>

    <div class="row">
        <div class="col-12">
            <div class="card">
                <div class="card-body">
                    <form [formGroup]="formDepartamento" class="row g-3" autocomplete="off">
                        <div class="col-lg-6">
                            <label for="Departament_ES" class="form-label" >Departamento_ES:</label>
                            <input id="Departament_ES" type="text"
                             class="form-control form-control-sm" placeholder="Departamento en español"
                                formControlName="Departament_ES">
                        </div>

                        
                        <div class="col-lg-6">
                            <label for="Departament_EN" class="form-label" >Departamento_EN:</label>
                            <input id="Departament_EN" type="text"
                             class="form-control form-control-sm" placeholder="Departamento en ingles"
                                formControlName="Departament_EN">
                        </div>

                        <div class="col-lg-6">
                            <label for="Acronym" class="form-label" >Acronym:</label>
                            <input id="Acronym" type="text"
                             class="form-control form-control-sm" placeholder="Abreviatura"
                                formControlName="Acronym">
                        </div>


                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<div class="modal-footer">
    <button *ngIf="pkDepartamento == null" class="btn btn-sm btn-primary" (click)="registrarDepartamento()">
        Registrar
    </button> 
        <button *ngIf="pkDepartamento != null" class="btn btn-sm btn-warning" (click)="actualizarDepartamento()">
        Actualizar
    </button>
    <button class="btn btn-sm btn-danger" (click)="cerrarModal()">
        {{cambiosForm || pkDepartamento != null ? 'Cancelar' : 'Cerrar'}}
    </button>
</div>
