<div class="modal-body dashboard">
    <div class="pagetitle">
        <h4 class="t-bold">
            {{pkUsuario == null ? 'Registrar' : 'Actualizar'}} usuario
        </h4>
        <nav>
            <ol class="breadcrumb">
                <li class="breadcrumb-item">Usuarios</li>
                <li class="breadcrumb-item active">{{pkUsuario == null ? 'Registrar' : 'Actualizar'}} usuario</li>
            </ol>
        </nav>
    </div>

    <div class="row">
        <div class="col-12">
            <div class="card">
                <div class="card-body">
                    <form [formGroup]="formUsuario" class="row g-3" autocomplete="off">

                        <div class="col-lg-6">
                            <label for="empleado" class="form-label">Empleado: </label> 
                            <select id="empleado" class="form-select form-select-sm" formControlName="id_employee">
                                <option value="" hidden> Selecciona una opción </option>
                            <option *ngFor="let empleado of listaempleado" [value]="empleado.id_employe">
                                {{ empleado.Name }}
                            </option>
                            </select>
                        </div>

                        <div class="col-lg-6">
                            <label for="busines_mail" class="form-label">Correo:</label>
                            <input id="busines_mail" type="email" class="form-control form-control-sm"
                                placeholder="correo_empresarial" formControlName="busines_mail">
                        </div>

                        <div class="col-lg-6">
                            <label for="password" class="form-label">Contraseña:</label>
                            <input id="password" type="password" class="form-control form-control-sm"
                                placeholder="Contraseña" formControlName="password">
                        </div>

                        <div class="col-lg-6">
                            <label for="rol" class="form-label">Rol Usuario:</label>
                            <select id="rol" class="form-select form-select-sm" formControlName="id_rol_users">
                                <option value="" hidden>Selecciona una opción</option>
                                 <option *ngFor="let rol of listaRol" [value]="rol.id_roles">
                                    {{ rol.roles }}
                                </option>
                            </select>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<div class="modal-footer">
    <button *ngIf="pkUsuario == null" class="btn btn-sm btn-primary" (click)="registrarUsuario()">
        Registrar
    </button>
    
    <button *ngIf="pkUsuario != null" class="btn btn-sm btn-warning" (click)="actualizarUsuario()">
        Actualizar
    </button>

    <button class="btn btn-sm btn-danger" (click)="cerrarModal()">
        {{cambiosForm || pkUsuario != null ? 'Cancelar' : 'Cerrar'}}
    </button>
</div>
