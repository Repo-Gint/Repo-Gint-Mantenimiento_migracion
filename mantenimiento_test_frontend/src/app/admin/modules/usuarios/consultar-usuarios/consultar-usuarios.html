<div class="pagetitle">
    <h1>Usuarios</h1>
    <nav>
        <ol class="breadcrumb">
            <li class="breadcrumb-item">Usuarios</li>
            <li class="breadcrumb-item active">Consulta Usuarios</li>
        </ol>
    </nav>
</div>

<section class="section dashboard">
    <div class="row">
        <div class="col-12">
            <div class="card">
                <div class="card-body row g-3">
                    <div class="botonera">
                        <button class="btn btn-success btn-sm">
                            Exportar
                        </button>
                    </div>
                </div>
            </div>
        </div>
<div class="col-12" style="margin-top: 20px !important;">
    <table class="table table-striped table-hover text-center">
        <thead>
            <tr>
                <th>Rol</th>
                <th>Empleado</th>
                <th>Correo</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let usuario of datosTabla; let i = index" [ngClass]="i % 2 === 0 ? 'table-info bg-opacity-25' : ''">
                <td>{{ usuario.rol }}</td>
                
                <td>{{ usuario.empleado }}</td>
                
                <td>{{ usuario.busines_mail }}</td>
                <td class="text-medium">
                    <button class="btn btn-sm btn-outline-primary"
                        (click)="abrirModalRegistrarUsuario(usuario.id_users)">
                        <i class="bi bi-pencil"></i>
                    </button>
                    
                    <button *ngIf="usuario.active == 0 || usuario.active == false" class="btn btn-sm btn-outline-success"
                        (click)="cambiarStatus(usuario)">
                        <i class="bi bi-check"></i>
                    </button>
                    
                    <button *ngIf="usuario.active == 1 || usuario.active == true" class="btn btn-sm btn-outline-warning"
                        (click)="cambiarStatus(usuario)">
                        <i class="bi bi-x"></i>
                    </button>
                </td>
            </tr>
        </tbody>
    </table>
</div>
    </div>
</section>
